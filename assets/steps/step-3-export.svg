<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" role="img" aria-labelledby="s3t">
  <title id="s3t">Copy the HTML, download a styled page, or share an instant link</title>

  <!-- source document -->
  <rect x="12" y="20" width="88" height="92" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <rect x="26" y="36" width="36" height="6" rx="3" fill="var(--brand,#D97757)"/>
  <g fill="var(--muted,#666666)" opacity=".3">
    <rect x="26" y="52" width="60" height="4" rx="2"/>
    <rect x="26" y="63" width="52" height="4" rx="2"/>
    <rect x="26" y="74" width="60" height="4" rx="2"/>
    <rect x="26" y="85" width="38" height="4" rx="2"/>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="var(--border,#eaeaea)" stroke-width="1.5">
    <path d="M100 66 C 130 66, 134 32, 164 32"/>
    <path d="M100 66 H164"/>
    <path d="M100 66 C 130 66, 134 100, 164 100"/>
  </g>

  <!-- output chips -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- copy html -->
    <rect x="164" y="18" width="124" height="28" rx="14"
          fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
    <g transform="translate(184,32) scale(.56) translate(-12,-12)" fill="none"
       stroke="var(--brand,#D97757)" stroke-width="2.4">
      <path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/>
    </g>
    <text x="198" y="36" font-family="'Geist', -apple-system, sans-serif" font-size="10.5"
          fill="var(--text,#000000)">Copy HTML</text>

    <!-- download -->
    <rect x="164" y="52" width="124" height="28" rx="14"
          fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
    <g transform="translate(184,66) scale(.56) translate(-12,-12)" fill="none"
       stroke="var(--brand,#D97757)" stroke-width="2.4">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
    </g>
    <text x="198" y="70" font-family="'Geist', -apple-system, sans-serif" font-size="10.5"
          fill="var(--text,#000000)">Download .html</text>

    <!-- share link -->
    <rect x="164" y="86" width="124" height="28" rx="14"
          fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
    <g transform="translate(184,100) scale(.56) translate(-12,-12)" fill="none"
       stroke="var(--brand,#D97757)" stroke-width="2.4">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </g>
    <text x="198" y="104" font-family="'Geist', -apple-system, sans-serif" font-size="10.5"
          fill="var(--text,#000000)">Share link</text>
  </g>
</svg>
