<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" role="img" aria-labelledby="s2t">
  <title id="s2t">Pick one of four themes, in light or dark mode</title>

  <!-- card A — selected -->
  <rect x="16" y="14" width="80" height="100" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--brand,#D97757)" stroke-width="2"/>
  <rect x="28" y="30" width="40" height="6" rx="3" fill="var(--brand,#D97757)"/>
  <g fill="var(--muted,#666666)" opacity=".35">
    <rect x="28" y="46" width="56" height="4" rx="2"/>
    <rect x="28" y="57" width="48" height="4" rx="2"/>
    <rect x="28" y="68" width="56" height="4" rx="2"/>
    <rect x="28" y="79" width="34" height="4" rx="2"/>
  </g>
  <rect x="28" y="92" width="24" height="10" rx="3" fill="var(--muted,#666666)" opacity=".18"/>
  <!-- selected badge -->
  <circle cx="96" cy="14" r="10" fill="var(--brand,#D97757)"/>
  <path d="M91.5 14 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- card B -->
  <rect x="110" y="14" width="80" height="100" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <rect x="122" y="30" width="34" height="6" rx="3" fill="var(--muted,#666666)" opacity=".5"/>
  <g fill="var(--muted,#666666)" opacity=".25">
    <rect x="122" y="46" width="56" height="4" rx="2"/>
    <rect x="122" y="57" width="52" height="4" rx="2"/>
    <rect x="122" y="68" width="56" height="4" rx="2"/>
    <rect x="122" y="79" width="40" height="4" rx="2"/>
    <rect x="122" y="90" width="50" height="4" rx="2"/>
  </g>

  <!-- card C — dark mode -->
  <rect x="204" y="14" width="80" height="100" rx="8" fill="#0d0d0d" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <rect x="216" y="30" width="34" height="6" rx="3" fill="#E8927C"/>
  <g fill="#ffffff" opacity=".28">
    <rect x="216" y="46" width="56" height="4" rx="2"/>
    <rect x="216" y="57" width="46" height="4" rx="2"/>
    <rect x="216" y="68" width="56" height="4" rx="2"/>
    <rect x="216" y="79" width="36" height="4" rx="2"/>
    <rect x="216" y="90" width="50" height="4" rx="2"/>
  </g>

  <!-- labels -->
  <g font-family="'Geist', -apple-system, sans-serif" font-size="9" fill="var(--muted,#666666)" text-anchor="middle">
    <text x="56" y="128">GitHub</text>
    <text x="150" y="128">Magazine</text>
    <text x="244" y="128">Dark</text>
  </g>
</svg>
