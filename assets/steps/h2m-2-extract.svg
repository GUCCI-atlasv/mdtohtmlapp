<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" role="img" aria-labelledby="h2t">
  <title id="h2t">Navigation, ads and scripts are stripped, leaving only the main content</title>

  <!-- source page -->
  <rect x="10" y="14" width="142" height="104" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <g fill="var(--muted,#666666)" opacity=".35">
    <circle cx="23" cy="26" r="2.5"/><circle cx="32" cy="26" r="2.5"/><circle cx="41" cy="26" r="2.5"/>
  </g>
  <path d="M10 34 H152" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>

  <!-- stripped: nav -->
  <g stroke="var(--muted,#666666)" stroke-width="1.2" opacity=".55" fill="none">
    <rect x="18" y="40" width="126" height="10" rx="3" stroke-dasharray="3 3"/>
    <path d="M132 42.5 l5 5 M137 42.5 l-5 5"/>
  </g>

  <!-- kept: main content -->
  <rect x="18" y="56" width="84" height="54" rx="5"
        fill="var(--brand,#D97757)" fill-opacity=".07" stroke="var(--brand,#D97757)" stroke-width="1.5"/>
  <rect x="26" y="63" width="38" height="5" rx="2.5" fill="var(--brand,#D97757)"/>
  <g fill="var(--muted,#666666)" opacity=".4">
    <rect x="26" y="74" width="66" height="4" rx="2"/>
    <rect x="26" y="83" width="56" height="4" rx="2"/>
    <rect x="26" y="92" width="66" height="4" rx="2"/>
    <rect x="26" y="101" width="40" height="4" rx="2"/>
  </g>

  <!-- stripped: ad + script -->
  <g stroke="var(--muted,#666666)" stroke-width="1.2" opacity=".55" fill="none">
    <rect x="108" y="56" width="36" height="30" rx="4" stroke-dasharray="3 3"/>
    <path d="M123 68 l6 6 M129 68 l-6 6"/>
    <rect x="108" y="92" width="36" height="18" rx="4" stroke-dasharray="3 3"/>
    <path d="M123 98 l6 6 M129 98 l-6 6"/>
  </g>

  <!-- arrow -->
  <g stroke="var(--brand,#D97757)" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M160 66 H176"/>
    <path d="M172 61 l5 5 l-5 5"/>
  </g>

  <!-- clean markdown result -->
  <rect x="188" y="24" width="100" height="84" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="9">
    <text x="200" y="44"><tspan fill="var(--brand,#D97757)">#</tspan><tspan fill="var(--text,#000000)"> Article title</tspan></text>
  </g>
  <g fill="var(--muted,#666666)" opacity=".35">
    <rect x="200" y="54" width="76" height="4" rx="2"/>
    <rect x="200" y="63" width="64" height="4" rx="2"/>
    <rect x="200" y="72" width="76" height="4" rx="2"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="9">
    <text x="200" y="90"><tspan fill="var(--brand,#D97757)">-</tspan><tspan fill="var(--muted,#666666)"> list item</tspan></text>
    <text x="200" y="102"><tspan fill="var(--brand,#D97757)">|</tspan><tspan fill="var(--muted,#666666)"> table </tspan><tspan fill="var(--brand,#D97757)">|</tspan></text>
  </g>
</svg>
