<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" role="img" aria-labelledby="p3t">
  <title id="p3t">Export opens the print dialog — choose Save as PDF, with no watermark</title>

  <!-- print dialog -->
  <rect x="12" y="14" width="150" height="104" rx="8"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <path d="M12 34 H162" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <text x="26" y="28" font-family="'Geist', -apple-system, sans-serif" font-size="10"
        font-weight="500" fill="var(--text,#000000)">Print</text>

  <text x="26" y="52" font-family="'Geist', -apple-system, sans-serif" font-size="9"
        fill="var(--muted,#666666)">Destination</text>
  <rect x="24" y="58" width="126" height="24" rx="6"
        fill="var(--brand,#D97757)" fill-opacity=".08" stroke="var(--brand,#D97757)" stroke-width="1.5"/>
  <text x="36" y="74" font-family="'Geist', -apple-system, sans-serif" font-size="10"
        font-weight="500" fill="var(--text,#000000)">Save as PDF</text>
  <path d="M133 68 l4 4 l6 -7" fill="none" stroke="var(--brand,#D97757)" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="var(--muted,#666666)" opacity=".3">
    <rect x="24" y="92" width="60" height="4" rx="2"/>
    <rect x="24" y="102" width="46" height="4" rx="2"/>
  </g>

  <!-- arrow -->
  <g stroke="var(--brand,#D97757)" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M170 66 H186"/>
    <path d="M182 61 l5 5 l-5 5"/>
  </g>

  <!-- pdf page -->
  <path d="M206 20 h44 l24 24 v58 a8 8 0 0 1 -8 8 h-60 a8 8 0 0 1 -8 -8 v-74 a8 8 0 0 1 8 -8 z"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <path d="M250 20 v24 h24" fill="none" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>
  <rect x="214" y="54" width="34" height="5" rx="2.5" fill="var(--brand,#D97757)"/>
  <g fill="var(--muted,#666666)" opacity=".32">
    <rect x="214" y="66" width="52" height="4" rx="2"/>
    <rect x="214" y="75" width="44" height="4" rx="2"/>
    <rect x="214" y="84" width="52" height="4" rx="2"/>
  </g>
  <text x="240" y="104" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace"
        font-size="11" font-weight="600" fill="var(--brand,#D97757)">PDF</text>
</svg>
