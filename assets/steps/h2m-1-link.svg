<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" role="img" aria-labelledby="h1t">
  <title id="h1t">Paste any public web page URL into the converter bar</title>

  <!-- url bar -->
  <rect x="12" y="40" width="276" height="48" rx="24"
        fill="var(--panel,#ffffff)" stroke="var(--border,#eaeaea)" stroke-width="1.5"/>

  <!-- link icon -->
  <g transform="translate(34,64) scale(.6) translate(-12,-12)" fill="none"
     stroke="var(--muted,#666666)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
  </g>

  <!-- pasted url -->
  <text x="52" y="68" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10">
    <tspan fill="var(--muted,#666666)">https://</tspan><tspan fill="var(--text,#000000)">example.com</tspan><tspan fill="var(--muted,#666666)">/post</tspan>
  </text>
  <rect x="197" y="58" width="1.5" height="15" rx="0.75" fill="var(--brand,#D97757)"/>

  <!-- convert button -->
  <rect x="208" y="50" width="70" height="28" rx="14" fill="var(--text,#000000)"/>
  <text x="243" y="68" text-anchor="middle" font-family="'Geist', -apple-system, sans-serif"
        font-size="10.5" font-weight="500" fill="var(--bg,#ffffff)">Convert</text>

  <!-- cursor -->
  <path d="M247 78 l0 16 l4.2 -4.2 l3 6 l3 -1.4 l-3 -5.8 l5.8 -0.6 z"
        fill="var(--text,#000000)" stroke="var(--panel,#ffffff)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- source hints -->
  <g font-family="'Geist', -apple-system, sans-serif" font-size="9" fill="var(--muted,#666666)" text-anchor="middle">
    <text x="66" y="112">Article</text>
    <text x="128" y="112">Docs</text>
    <text x="186" y="112">README</text>
    <text x="248" y="112">Blog post</text>
  </g>
  <g fill="var(--brand,#D97757)" opacity=".55">
    <circle cx="42" cy="109" r="2"/><circle cx="108" cy="109" r="2"/>
    <circle cx="156" cy="109" r="2"/><circle cx="214" cy="109" r="2"/>
  </g>
</svg>
